name: release

# A release is a tag and nothing else: push v0.1.0 and this builds it,
# rehearses on TestPyPI and then uploads to PyPI.  Nothing here can be
# retried by hand afterwards, which is the point -- PyPI never lets a
# filename be used twice, not even after the release is deleted, so
# jimbeamer-0.1.0.tar.gz is spent the moment it lands.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # The tag is what the release is called; _version.py is what ends up
      # in the metadata and in the filename.  They are two places saying
      # the same thing, so they can disagree -- and the moment to find out
      # is here, before anything has been uploaded.
      - name: The tag and _version.py must agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c 'import jimbeamer._version as v; print(v.VERSION)')
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME says $tag, _version.py says $version"
            exit 1
          fi

      # --strict so that a description PyPI would render badly fails here
      # rather than being discovered on the project page.
      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*

      # The suite is not run again here: test.yml runs it on every push to
      # master, and a tag is made from a commit that is already there.  A
      # tag itself runs nothing in test.yml -- tags are not branches --
      # so if that ever stops being true this is where it would be noticed
      # last.  What this step does is meet the wheel as a stranger would.
      - name: Install the wheel and use it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/jimbeamer --version
          printf -- '---\ntitle: T\n---\n\n# S\n\n* a bullet\n' > deck.md
          /tmp/clean/bin/jimbeamer deck.md -o deck.tex
          grep -q 'begin{frame}{S}' deck.tex

      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  # Both uploads go through Trusted Publishing: the job proves to PyPI that
  # it is this workflow in this repository, and no token is stored anywhere.
  # It needs a publisher configured on each side -- pypi.org and
  # test.pypi.org separately -- naming owner, repository, release.yml and
  # the environment below.
  testpypi:
    name: rehearse on TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write           # Trusted Publishing; job level, not workflow

    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      # skip-existing because a rehearsal may already have put this version
      # there by hand.  The real upload below gets no such licence.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  # The rehearsal is only a rehearsal if something inspects it.  This is
  # the half that does not need a human: install what was just published,
  # from the index it was published to, and convert a deck with it.  A
  # README that renders badly still needs the eyes the 'pypi' environment
  # waits for, but a package that cannot be installed at all fails here --
  # before the filename on PyPI is spent.
  #
  # Deliberately not in the job above: that one holds the OIDC token, and
  # it has no business also running pip against an external index.
  verify:
    name: install it from TestPyPI
    needs: testpypi
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install the version this tag published, and use it
        run: |
          version="${GITHUB_REF_NAME#v}"
          python -m venv /tmp/rehearsal

          # TestPyPI does not serve a new file the instant twine returns,
          # and the index is the thing being tested, so this waits rather
          # than failing on the first miss.  Pinned to the exact version:
          # unpinned, pip could satisfy it from an older copy left by an
          # earlier rehearsal and prove nothing.
          #
          # --extra-index-url because TestPyPI is not a mirror: its marko
          # stops at 2.0.3 and this needs 2.2.3.
          installed=
          for attempt in 1 2 3 4 5 6 7 8; do
            if /tmp/rehearsal/bin/pip install \
                 --index-url https://test.pypi.org/simple/ \
                 --extra-index-url https://pypi.org/simple/ \
                 "jimbeamer==$version"; then
              installed=yes
              break
            fi
            echo "not on TestPyPI yet (attempt $attempt); waiting"
            sleep 15
          done
          if [ -z "$installed" ]; then
            echo "jimbeamer==$version never became installable from TestPyPI"
            exit 1
          fi

          cd /tmp
          /tmp/rehearsal/bin/jimbeamer --version
          printf -- '---\ntitle: T\n---\n\n# S\n\n* a bullet\n' > deck.md
          # the conversion fills the Beamer template, so this fails too if
          # the package data did not travel
          /tmp/rehearsal/bin/jimbeamer deck.md -o deck.tex
          grep -q 'begin{frame}{S}' deck.tex

  pypi:
    name: publish to PyPI
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

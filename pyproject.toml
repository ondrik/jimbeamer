# 77 and not 64: 'license = "MIT"' with license-files below is PEP 639,
# which earlier setuptools refuses outright -- "project.license must be
# valid exactly by one definition (2 matches found)".  Nothing notices
# while pip builds in isolation, since that fetches the newest setuptools;
# it is a build with --no-build-isolation that stops, which is how a distro
# packager builds.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jimbeamer"
description = "Convert Markdown into LaTeX Beamer slides"
authors = [{ name = "Ondřej Lengál", email = "ondra.lengal@gmail.com" }]
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["markdown", "latex", "beamer", "slides", "presentation"]
dynamic = ["version"]

# marko is the one to watch: the converter registers custom elements
# against its parser internals.  2.2.3 is not where development started, it
# is where the suite passes -- on 2.2.0 through 2.2.2 a raw environment
# following a directive line loses its indentation and has '\\' collapsed to
# '\', so a table row ends in a single backslash and pdflatex stops at
# "Misplaced \noalign".  The converter exits 0 and says nothing, which is
# why the floor has to carry it: a resolver that lands on 2.2.2 is not
# otherwise told.  PyYAML's bound is the version it was developed against.
dependencies = [
    "marko>=2.2.3",
    "PyYAML>=6.0",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Multimedia :: Graphics :: Presentation",
]

# Homepage is the landing page in docs/, which GitHub Pages serves; the
# repository is reached by Source.  They are the two links PyPI puts in its
# sidebar, and a reader wanting the tool and a reader wanting the code are
# not the same reader.
[project.urls]
Homepage = "https://ondrik.github.io/jimbeamer/"
Source = "https://github.com/ondrik/jimbeamer"
Issues = "https://github.com/ondrik/jimbeamer/issues"

# What pip installs as a command, the way rubber does.
[project.scripts]
jimbeamer = "jimbeamer:main"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["jimbeamer"]

# The Beamer preamble travels with the package: installed, the module is in
# site-packages and the command in bin/, so there is no script for it to sit
# beside any more.
[tool.setuptools.package-data]
jimbeamer = ["beamer.tex.tpl"]

# Read without importing the converter, which would want marko first.
[tool.setuptools.dynamic]
version = { attr = "jimbeamer._version.VERSION" }

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "jimbeamer"
description = "Convert Markdown into LaTeX Beamer slides"
authors = [{ name = "Ondřej Lengál", email = "ondra.lengal@gmail.com" }]
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["markdown", "latex", "beamer", "slides", "presentation"]
dynamic = ["version"]

# The lower bounds are the versions it was developed against; earlier ones
# may well work, but have not been tried.  marko is the one to watch: the
# converter registers custom elements against its parser internals.
dependencies = [
    "marko>=2.2",
    "PyYAML>=6.0",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Multimedia :: Graphics :: Presentation",
]

[project.urls]
Homepage = "https://github.com/ondrik/jimbeamer"
Source = "https://github.com/ondrik/jimbeamer"
Issues = "https://github.com/ondrik/jimbeamer/issues"

# What pip installs as a command, the way rubber does.
[project.scripts]
jimbeamer = "jimbeamer:main"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["jimbeamer"]

# The Beamer preamble travels with the package: installed, the module is in
# site-packages and the command in bin/, so there is no script for it to sit
# beside any more.
[tool.setuptools.package-data]
jimbeamer = ["beamer.tex.tpl"]

# Read without importing the converter, which would want marko first.
[tool.setuptools.dynamic]
version = { attr = "jimbeamer._version.VERSION" }
